<div class="cg-auth-wrapper" [style.background-image]="'url(' + backgroundImage + ')'">
  <!-- Soft Contrast Overlay -->
  <div class="cg-auth-overlay" aria-hidden="true"></div>

  <!-- Top Navigation Pill -->
  <header class="cg-auth-top-bar">
    <a routerLink="/" class="cg-auth-back-link" title="Return to CeylonGo Homepage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="cg-back-icon" aria-hidden="true">
        <path d="m15 18-6-6 6-6" />
      </svg>
      <span>Back to CeylonGo</span>
    </a>
  </header>

  <!-- Content Stage -->
  <main class="cg-auth-stage">
    <div class="cg-auth-content-grid">
      <!-- White Auth Card -->
      <section class="cg-auth-card" aria-labelledby="auth-heading">
        <!-- Logo Header -->
        <div class="cg-auth-card-header">
          <a routerLink="/" class="cg-auth-logo-link" aria-label="CeylonGo Home">
            <img
              src="assets/branding/ceylongo-logo.png"
              alt="CeylonGo — Discover Local. Feel at Home."
              class="cg-auth-logo"
              width="170"
              height="68"
            />
          </a>
          <h1 id="auth-heading" class="cg-auth-heading">{{ cardTitle }}</h1>
          <p class="cg-auth-subtitle">{{ cardSubtitle }}</p>
        </div>

        <!-- Form Slot -->
        <div class="cg-auth-card-body">
          <ng-content></ng-content>
        </div>
      </section>

      <!-- Scenic Side Tagline (Desktop) -->
      @if (taglineMain || taglineHighlight || taglineSub) {
        <aside class="cg-auth-scenic-tagline" aria-hidden="true">
          @if (taglineMain) {
            <span class="cg-tagline-line cg-tagline-line--1">{{ taglineMain }}</span>
          }
          @if (taglineHighlight) {
            <span class="cg-tagline-line cg-tagline-line--highlight">{{ taglineHighlight }}</span>
          }
          @if (taglineSub) {
            <span class="cg-tagline-line cg-tagline-line--sub">{{ taglineSub }}</span>
          }
          <div class="cg-tagline-brush-accent"></div>
        </aside>
      }
    </div>
  </main>
</div>
