<app-auth-layout
  backgroundImage="assets/images/destinations/dest_sigiriya.jpg"
  cardTitle="Welcome Back"
  cardSubtitle="Sign in to continue your CeylonGo journey"
  taglineMain="Sri Lanka"
  taglineHighlight="More Than"
  taglineSub="a Destination"
>
  <!-- Demo-Only Notice Banner -->
  @if (demoSuccessMessage()) {
    <div class="cg-auth-demo-banner" role="status" aria-live="polite">
      <div class="cg-demo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <span>Demo Simulation</span>
      </div>
      <p class="cg-demo-message">{{ demoSuccessMessage() }}</p>
      <button type="button" class="cg-demo-dismiss-btn" (click)="dismissDemoBanner()">
        Dismiss
      </button>
    </div>
  }

  <!-- Login Form -->
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="cg-auth-form" novalidate>
    <!-- Email Field -->
    <div class="cg-auth-field">
      <label for="login-email" class="cg-auth-label">
        <span>Email Address</span>
      </label>
      <div class="cg-input-wrapper" [class.has-error]="isFieldInvalid('email')">
        <svg class="cg-input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="20" height="16" x="2" y="4" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </svg>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          placeholder="Email address"
          class="cg-auth-input"
          [class.is-invalid]="isFieldInvalid('email')"
          autocomplete="email"
          aria-required="true"
          [attr.aria-invalid]="isFieldInvalid('email')"
          [attr.aria-describedby]="isFieldInvalid('email') ? 'login-email-error' : null"
        />
      </div>
      @if (isFieldInvalid('email')) {
        <div id="login-email-error" class="cg-auth-error" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span>{{ getFieldError('email') }}</span>
        </div>
      }
    </div>

    <!-- Password Field -->
    <div class="cg-auth-field">
      <label for="login-password" class="cg-auth-label">
        <span>Password</span>
      </label>
      <div class="cg-input-wrapper" [class.has-error]="isFieldInvalid('password')">
        <svg class="cg-input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          placeholder="Password"
          class="cg-auth-input cg-auth-input--password"
          [class.is-invalid]="isFieldInvalid('password')"
          autocomplete="current-password"
          aria-required="true"
          [attr.aria-invalid]="isFieldInvalid('password')"
          [attr.aria-describedby]="isFieldInvalid('password') ? 'login-password-error' : null"
        />
        <button
          type="button"
          class="cg-input-btn-toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword()"
        >
          @if (showPassword()) {
            <!-- Eye Off -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
              <line x1="2" y1="2" x2="22" y2="22" />
            </svg>
          } @else {
            <!-- Eye On -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
      @if (isFieldInvalid('password')) {
        <div id="login-password-error" class="cg-auth-error" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span>{{ getFieldError('password') }}</span>
        </div>
      }
    </div>

    <!-- Remember Me & Forgot Password Row -->
    <div class="cg-auth-row-between">
      <label class="cg-auth-checkbox-label">
        <input type="checkbox" formControlName="rememberMe" id="login-remember" />
        <span>Remember me</span>
      </label>
      <a routerLink="/auth/forgot-password" class="cg-auth-link-forgot">
        Forgot password?
      </a>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      class="cg-auth-submit-btn"
      [disabled]="isSubmitting()"
      id="login-submit-btn"
    >
      @if (isSubmitting()) {
        <span class="cg-spinner" aria-hidden="true"></span>
        <span>Signing in...</span>
      } @else {
        <span>Sign In</span>
      }
    </button>
  </form>

  <!-- Signup Navigation Footer -->
  <footer class="cg-auth-footer-nav">
    <span>Don't have an account?</span>
    <a routerLink="/auth/register" id="login-to-register-link">Sign Up</a>
  </footer>
</app-auth-layout>
