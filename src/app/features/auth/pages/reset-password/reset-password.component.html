<app-auth-layout
  backgroundImage="assets/images/destinations/dest_ella.jpg"
  cardTitle="Reset Your Password"
  cardSubtitle="Enter your new password below."
  taglineMain="New"
  taglineHighlight="Journeys"
  taglineSub="Ahead"
>
  <!-- Demo-Only Notice Banner -->
  @if (demoSuccessMessage()) {
    <div class="cg-auth-demo-banner" role="status" aria-live="polite">
      <div class="cg-demo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <span>Demo Simulation</span>
      </div>
      <p class="cg-demo-message">{{ demoSuccessMessage() }}</p>
      <button type="button" class="cg-demo-dismiss-btn" (click)="dismissDemoBanner()">
        Dismiss
      </button>
    </div>
  }

  <!-- Reset Password Form -->
  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="cg-auth-form" novalidate>
    <!-- New Password Field -->
    <div class="cg-auth-field">
      <label for="reset-new-password" class="cg-auth-label">
        <span>New Password</span>
      </label>
      <div class="cg-input-wrapper" [class.has-error]="isFieldInvalid('newPassword')">
        <svg class="cg-input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <input
          id="reset-new-password"
          [type]="showNewPassword() ? 'text' : 'password'"
          formControlName="newPassword"
          placeholder="New password (min. 8 characters)"
          class="cg-auth-input cg-auth-input--password"
          [class.is-invalid]="isFieldInvalid('newPassword')"
          autocomplete="new-password"
          aria-required="true"
          [attr.aria-invalid]="isFieldInvalid('newPassword')"
          [attr.aria-describedby]="isFieldInvalid('newPassword') ? 'reset-new-password-error' : null"
        />
        <button
          type="button"
          class="cg-input-btn-toggle"
          (click)="toggleNewPasswordVisibility()"
          [attr.aria-label]="showNewPassword() ? 'Hide new password' : 'Show new password'"
          [attr.aria-pressed]="showNewPassword()"
        >
          @if (showNewPassword()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
              <line x1="2" y1="2" x2="22" y2="22" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
      @if (isFieldInvalid('newPassword')) {
        <div id="reset-new-password-error" class="cg-auth-error" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span>{{ getFieldError('newPassword') }}</span>
        </div>
      }
    </div>

    <!-- Confirm New Password Field -->
    <div class="cg-auth-field">
      <label for="reset-confirm-password" class="cg-auth-label">
        <span>Confirm New Password</span>
      </label>
      <div class="cg-input-wrapper" [class.has-error]="isFieldInvalid('confirmNewPassword')">
        <svg class="cg-input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <input
          id="reset-confirm-password"
          [type]="showConfirmNewPassword() ? 'text' : 'password'"
          formControlName="confirmNewPassword"
          placeholder="Confirm new password"
          class="cg-auth-input cg-auth-input--password"
          [class.is-invalid]="isFieldInvalid('confirmNewPassword')"
          autocomplete="new-password"
          aria-required="true"
          [attr.aria-invalid]="isFieldInvalid('confirmNewPassword')"
          [attr.aria-describedby]="isFieldInvalid('confirmNewPassword') ? 'reset-confirm-password-error' : null"
        />
        <button
          type="button"
          class="cg-input-btn-toggle"
          (click)="toggleConfirmNewPasswordVisibility()"
          [attr.aria-label]="showConfirmNewPassword() ? 'Hide confirm password' : 'Show confirm password'"
          [attr.aria-pressed]="showConfirmNewPassword()"
        >
          @if (showConfirmNewPassword()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
              <line x1="2" y1="2" x2="22" y2="22" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
      @if (isFieldInvalid('confirmNewPassword')) {
        <div id="reset-confirm-password-error" class="cg-auth-error" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span>{{ getFieldError('confirmNewPassword') }}</span>
        </div>
      }
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      class="cg-auth-submit-btn"
      [disabled]="isSubmitting()"
      id="reset-submit-btn"
    >
      @if (isSubmitting()) {
        <span class="cg-spinner" aria-hidden="true"></span>
        <span>Resetting password...</span>
      } @else {
        <span>Reset Password</span>
      }
    </button>
  </form>

  <!-- Back to Sign In Link -->
  <a routerLink="/auth/login" class="cg-auth-back-link-card" id="reset-to-login-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m15 18-6-6 6-6" />
    </svg>
    <span>Back to Sign In</span>
  </a>
</app-auth-layout>
