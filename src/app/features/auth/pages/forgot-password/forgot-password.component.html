<app-auth-layout
  backgroundImage="assets/images/destinations/dest_nuwara_eliya.jpg"
  cardTitle="Forgot Password?"
  cardSubtitle="No worries! Enter your email address and we'll send you a link to reset your password."
  taglineMain="Rediscover"
  taglineSub="Your Journey"
>
  <!-- Demo-Only Notice Banner -->
  @if (demoSuccessMessage()) {
    <div class="cg-auth-demo-banner" role="status" aria-live="polite">
      <div class="cg-demo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <span>Demo Simulation</span>
      </div>
      <p class="cg-demo-message">{{ demoSuccessMessage() }}</p>
      <button type="button" class="cg-demo-dismiss-btn" (click)="dismissDemoBanner()">
        Dismiss
      </button>
    </div>
  }

  <!-- Forgot Password Form -->
  <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="cg-auth-form" novalidate>
    <!-- Email Field -->
    <div class="cg-auth-field">
      <label for="forgot-email" class="cg-auth-label">
        <span>Email Address</span>
      </label>
      <div class="cg-input-wrapper" [class.has-error]="isFieldInvalid('email')">
        <svg class="cg-input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="20" height="16" x="2" y="4" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </svg>
        <input
          id="forgot-email"
          type="email"
          formControlName="email"
          placeholder="Email address"
          class="cg-auth-input"
          [class.is-invalid]="isFieldInvalid('email')"
          autocomplete="email"
          aria-required="true"
          [attr.aria-invalid]="isFieldInvalid('email')"
          [attr.aria-describedby]="isFieldInvalid('email') ? 'forgot-email-error' : null"
        />
      </div>
      @if (isFieldInvalid('email')) {
        <div id="forgot-email-error" class="cg-auth-error" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span>{{ getFieldError('email') }}</span>
        </div>
      }
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      class="cg-auth-submit-btn"
      [disabled]="isSubmitting()"
      id="forgot-submit-btn"
    >
      @if (isSubmitting()) {
        <span class="cg-spinner" aria-hidden="true"></span>
        <span>Sending link...</span>
      } @else {
        <span>Send Reset Link</span>
      }
    </button>
  </form>

  <!-- Back to Sign In Link -->
  <a routerLink="/auth/login" class="cg-auth-back-link-card" id="forgot-to-login-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m15 18-6-6 6-6" />
    </svg>
    <span>Back to Sign In</span>
  </a>
</app-auth-layout>
