<div class="cg-homestays-block">
  <!-- Section Header -->
  <div class="cg-block-header">
    <div class="cg-block-header-left">
      <h2 class="cg-block-title">
        Featured <span class="cg-title-accent">Homestays</span>
      </h2>
    </div>
    <a routerLink="/homestays" class="cg-block-view-all">
      <span>View All Homestays</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12" />
        <polyline points="12 5 19 12 12 19" />
      </svg>
    </a>
  </div>

  <!-- Cards Grid (4 cards in row) -->
  <div class="cg-homestays-grid">
    @for (stay of homestays; track stay.id) {
      <div class="cg-homestay-card">
        <div class="cg-stay-img-wrap">
          <img
            [src]="stay.imageUrl"
            [alt]="stay.name + ' in ' + stay.location"
            class="cg-stay-img"
            loading="lazy"
          />
          <button
            type="button"
            class="cg-fav-btn"
            [class.active]="stay.isFavorite"
            (click)="toggleFavorite(stay, $event)"
            [attr.aria-label]="'Save ' + stay.name + ' to favorites'"
          >
            <svg viewBox="0 0 24 24" [attr.fill]="stay.isFavorite ? '#ef4444' : 'none'" stroke="currentColor" stroke-width="2">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
            </svg>
          </button>
        </div>

        <div class="cg-stay-body">
          <h3 class="cg-stay-title" [title]="stay.name">{{ stay.name }}</h3>
          <p class="cg-stay-location">{{ stay.location }}</p>

          <div class="cg-stay-rating-row">
            <span class="cg-star" aria-hidden="true">★</span>
            <span class="cg-rating-score">{{ stay.rating }}</span>
            <span class="cg-rating-count">({{ stay.reviewCount }})</span>
          </div>

          <div class="cg-stay-price-row">
            <span class="cg-price-val">LKR {{ stay.priceLkr | number }}</span>
            <span class="cg-price-unit">/ night</span>
          </div>
        </div>
      </div>
    }
  </div>
</div>
