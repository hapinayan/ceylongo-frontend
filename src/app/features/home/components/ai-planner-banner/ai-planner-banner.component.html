<section class="cg-ai-banner-section" aria-label="AI Travel Planner">
  <div class="cg-container">
    <div class="cg-ai-banner">
      <!-- Background Decorative Palm Watermark -->
      <div class="cg-ai-watermark" aria-hidden="true"></div>

      <!-- Left: Mascot & Pitch -->
      <div class="cg-ai-info">
        <div class="cg-ai-mascot-wrap">
          <img
            src="assets/images/ai/ai_mascot.svg"
            alt="CeylonGo 3D AI travel robot assistant mascot"
            class="cg-ai-mascot"
            width="120"
            height="120"
          />
        </div>
        <div class="cg-ai-text">
          <h2 class="cg-ai-title">
            Your Sri Lankan Journey,<br />
            <span class="cg-ai-title-highlight">Planned by AI</span>
          </h2>
          <p class="cg-ai-desc">
            Get a personalized travel itinerary based on your interests, duration and budget.
          </p>
        </div>
      </div>

      <!-- Right: Interactive Prompt Bar -->
      <div class="cg-ai-form-card">
        <form class="cg-ai-form" (ngSubmit)="onGenerate()">
          <!-- Destination Field -->
          <div class="cg-ai-field">
            <label for="cg-ai-dest" class="cg-ai-label">Where do you want to go?</label>
            <select
              id="cg-ai-dest"
              class="cg-ai-select"
              [ngModel]="selectedDestination()"
              (ngModelChange)="selectedDestination.set($event)"
              name="destination"
            >
              <option value="" disabled selected>Select Destination</option>
              @for (dest of destinations; track dest) {
                <option [value]="dest">{{ dest }}</option>
              }
            </select>
          </div>

          <div class="cg-ai-divider" aria-hidden="true"></div>

          <!-- Duration Field -->
          <div class="cg-ai-field">
            <label for="cg-ai-duration" class="cg-ai-label">Travel Duration</label>
            <input
              id="cg-ai-duration"
              type="text"
              class="cg-ai-input"
              placeholder="e.g. 3 Days"
              [ngModel]="travelDuration()"
              (ngModelChange)="travelDuration.set($event)"
              name="duration"
            />
          </div>

          <div class="cg-ai-divider" aria-hidden="true"></div>

          <!-- Interests Field -->
          <div class="cg-ai-field">
            <label for="cg-ai-interest" class="cg-ai-label">Your Interests</label>
            <select
              id="cg-ai-interest"
              class="cg-ai-select"
              [ngModel]="selectedInterest()"
              (ngModelChange)="selectedInterest.set($event)"
              name="interest"
            >
              <option value="" disabled selected>Nature, Culture, Beach...</option>
              @for (interest of interests; track interest) {
                <option [value]="interest">{{ interest }}</option>
              }
            </select>
          </div>

          <!-- Submit Action -->
          <button type="submit" class="cg-ai-btn" [disabled]="isGenerating()">
            @if (isGenerating()) {
              <span class="cg-spinner" aria-hidden="true"></span>
              <span>Planning...</span>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z" />
              </svg>
              <span>Generate My Itinerary</span>
            }
          </button>
        </form>

        @if (generatedNotice()) {
          <div class="cg-ai-notice" role="status">
            ✨ Sample itinerary for <strong>{{ selectedDestination() || 'Cultural Triangle' }}</strong> ({{ travelDuration() }}) initialized! (Preview UI Demo)
          </div>
        }
      </div>
    </div>
  </div>
</section>
