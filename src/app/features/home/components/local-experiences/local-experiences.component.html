<div class="cg-experiences-block">
  <!-- Section Header -->
  <div class="cg-block-header">
    <div class="cg-block-header-left">
      <h2 class="cg-block-title">
        Local <span class="cg-title-accent">Experiences</span>
      </h2>
    </div>
    <a routerLink="/experiences" class="cg-block-view-all">
      <span>View All Experiences</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12" />
        <polyline points="12 5 19 12 12 19" />
      </svg>
    </a>
  </div>

  <!-- Cards Grid (4 cards in row) -->
  <div class="cg-experiences-grid">
    @for (exp of experiences; track exp.id) {
      <a [routerLink]="['/experiences', exp.id]" class="cg-experience-card" [attr.aria-label]="'Explore ' + exp.title">
        <div class="cg-exp-img-wrap">
          <img
            [src]="exp.imageUrl"
            [alt]="exp.title + ' in ' + exp.location"
            class="cg-exp-img"
            loading="lazy"
          />
        </div>

        <div class="cg-exp-body">
          <h3 class="cg-exp-title" [title]="exp.title">{{ exp.title }}</h3>
          <p class="cg-exp-location">{{ exp.location }}</p>

          <div class="cg-exp-footer">
            <div class="cg-exp-rating-row">
              <span class="cg-star" aria-hidden="true">★</span>
              <span class="cg-rating-score">{{ exp.rating || 4.7 }}</span>
              <span class="cg-rating-count">({{ exp.reviewCount || 20 }})</span>
            </div>

            <div class="cg-exp-arrow-btn" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
              </svg>
            </div>
          </div>
        </div>
      </a>
    }
  </div>
</div>
