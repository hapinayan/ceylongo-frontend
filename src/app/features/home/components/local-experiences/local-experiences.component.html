<div class="cg-experiences-block">
  <!-- Section Header -->
  <div class="cg-block-header">
    <div class="cg-block-header-left">
      <h2 class="cg-block-title">Local Experiences</h2>
      <p class="cg-block-subtitle">Join authentic cultural activities and unique local experiences</p>
    </div>
    <a routerLink="/experiences" class="cg-block-view-all">
      <span>View All Experiences</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12" />
        <polyline points="12 5 19 12 12 19" />
      </svg>
    </a>
  </div>

  <!-- Cards Grid (4 cards) -->
  <div class="cg-experiences-grid">
    @for (exp of experiences; track exp.id) {
      <a [routerLink]="['/experiences', exp.id]" class="cg-experience-card">
        <div class="cg-exp-img-wrap">
          <img [src]="exp.imageUrl" [alt]="exp.title + ' in ' + exp.location" class="cg-exp-img" loading="lazy" />
        </div>

        <div class="cg-exp-body">
          <h3 class="cg-exp-title">{{ exp.title }}</h3>
          <div class="cg-exp-location">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
              <circle cx="12" cy="10" r="3" />
            </svg>
            <span>{{ exp.location }}</span>
          </div>

          <div class="cg-exp-price">
            LKR {{ exp.priceLkr | number }}
          </div>
        </div>
      </a>
    }
  </div>
</div>
