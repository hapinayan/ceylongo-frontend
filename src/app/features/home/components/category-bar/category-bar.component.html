<section class="cg-features-section" aria-label="What you can do with CeylonGo">
  <div class="cg-container">
    <!-- Section Header (Ref: "WHAT YOU CAN DO WITH CEYLONGO", "Simple Travel, Meaningful Experiences") -->
    <app-section-header
      kicker="WHAT YOU CAN DO WITH CEYLONGO"
      title="Simple Travel, "
      highlightText="Meaningful Experiences"
      align="center"
    ></app-section-header>

    <!-- 4 Modern Tourism Cards (Ref Design Grid) -->
    <div class="cg-features-grid">
      @for (item of items; track item.id) {
        <a [routerLink]="item.link" class="cg-feature-card">
          <!-- Icon in pastel rounded square -->
          <div class="cg-feature-icon-box" [style.background-color]="item.iconBg" [style.color]="item.iconColor">
            @switch (item.icon) {
              @case ('home') {
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
                  <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" />
                </svg>
              }
              @case ('map') {
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path fill-rule="evenodd" d="M8.16 2.75a.75.75 0 01.65.375l2.44 4.066 3.037-3.037a.75.75 0 01.99-.057l5.25 4.5a.75.75 0 01.263.57v11.25a.75.75 0 01-1.144.64l-4.746-2.848-3.32 3.32a.75.75 0 01-.99.057l-5.25-4.5a.75.75 0 01-.263-.57V5.25a.75.75 0 01.423-.678l2.66-1.33a.75.75 0 01.373-.092zM9 5.578L5.75 7.203v8.947l3.25 2.786V5.578zm1.5 13.064l3.19-3.19a.75.75 0 01.883-.112l4.677 2.806V7.098l-3.25-2.786-3.19 3.19a.75.75 0 01-.883.112L10.5 6.002v12.64z" clip-rule="evenodd" />
                </svg>
              }
              @case ('robot') {
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2a1 1 0 0 1 1 1v1.07A7.002 7.002 0 0 1 19 11v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-6a7.002 7.002 0 0 1 6-6.93V3a1 1 0 0 1 1-1zm-4 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm8 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm-6 4a1 1 0 0 0 0 2h4a1 1 0 1 0 0-2H10z" />
                </svg>
              }
              @case ('pin') {
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path fill-rule="evenodd" d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041a16.975 16.975 0 001.144-.742 19.58 19.58 0 002.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 00-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 002.682 2.282 16.975 16.975 0 001.145.742zM12 13.5a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                </svg>
              }
            }
          </div>

          <!-- Title & Description -->
          <div class="cg-feature-text">
            <h3 class="cg-feature-title">{{ item.title }}</h3>
            <p class="cg-feature-desc">{{ item.description }}</p>
          </div>

          <!-- Bottom Right Circle Arrow Button -->
          <div class="cg-feature-arrow-btn" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </div>
        </a>
      }
    </div>
  </div>
</section>
