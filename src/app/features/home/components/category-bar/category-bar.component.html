<section class="cg-quick-benefits-section" aria-label="CeylonGo Highlights">
  <div class="cg-container">
    <div class="cg-benefits-grid">
      @for (item of benefits; track item.id) {
        <div class="cg-benefit-card">
          <div class="cg-benefit-icon-box" [style.background-color]="item.iconBg" [style.color]="item.iconColor">
            @switch (item.icon) {
              @case ('home') {
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
                  <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" />
                </svg>
              }
              @case ('leaf') {
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75 0 4.148 2.585 7.69 6.25 9.103V15.75a2.25 2.25 0 012.25-2.25h1.5a.75.75 0 00.75-.75V11.25a3.75 3.75 0 013.75-3.75h.75A9.722 9.722 0 0012 2.25zM15 15.75h1.5a2.25 2.25 0 012.25 2.25v1.353A9.715 9.715 0 0021.75 12c0-2.34-.825-4.488-2.203-6.173a5.25 5.25 0 00-4.547 5.173v1.5a2.25 2.25 0 01-2.25 2.25h-.75a.75.75 0 00-.75.75v1.5c0 .414.336.75.75.75h3z" clip-rule="evenodd" />
                </svg>
              }
              @case ('map') {
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path fill-rule="evenodd" d="M8.16 2.75a.75.75 0 01.65.375l2.44 4.066 3.037-3.037a.75.75 0 01.99-.057l5.25 4.5a.75.75 0 01.263.57v11.25a.75.75 0 01-1.144.64l-4.746-2.848-3.32 3.32a.75.75 0 01-.99.057l-5.25-4.5a.75.75 0 01-.263-.57V5.25a.75.75 0 01.423-.678l2.66-1.33a.75.75 0 01.373-.092zM9 5.578L5.75 7.203v8.947l3.25 2.786V5.578zm1.5 13.064l3.19-3.19a.75.75 0 01.883-.112l4.677 2.806V7.098l-3.25-2.786-3.19 3.19a.75.75 0 01-.883.112L10.5 6.002v12.64z" clip-rule="evenodd" />
                </svg>
              }
              @case ('community') {
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M4.5 6.375a4.125 4.125 0 118.25 0 4.125 4.125 0 01-8.25 0zM14.25 8.625a3.375 3.375 0 116.75 0 3.375 3.375 0 01-6.75 0zM1.5 19.125a7.125 7.125 0 0114.25 0v.003l-.001.119a.75.75 0 01-.363.63 13.067 13.067 0 01-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 01-.364-.63l-.001-.122zM17.25 19.128l-.001.144a2.25 2.25 0 01-.233.96 10.088 10.088 0 005.06-1.104.75.75 0 00.424-.67v-.006a5.25 5.25 0 00-5.25-5.25h-.08a7.12 7.12 0 01.08 5.926z" />
                </svg>
              }
            }
          </div>
          <div class="cg-benefit-text">
            <h3 class="cg-benefit-title">{{ item.title }}</h3>
            <p class="cg-benefit-desc">{{ item.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
