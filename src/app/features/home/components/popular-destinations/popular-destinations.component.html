<section class="cg-destinations-section">
  <div class="cg-container">
    <!-- Section Header -->
    <div class="cg-section-header">
      <div class="cg-section-header-left">
        <h2 class="cg-section-title">Explore Sri Lanka</h2>
        <p class="cg-section-subtitle">Discover amazing destinations across 9 provinces</p>
      </div>
      <a routerLink="/destinations" class="cg-view-all-btn">
        <span>View All Destinations</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </a>
    </div>

    <!-- Carousel Container with Arrows -->
    <div class="cg-carousel-wrapper">
      <button
        type="button"
        class="cg-carousel-arrow cg-carousel-arrow--left"
        (click)="scrollLeft()"
        aria-label="Previous destinations"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>

      <div class="cg-destinations-row" #cardsContainer>
        @for (dest of destinations; track dest.id) {
          <a [routerLink]="['/destinations', dest.id]" class="cg-dest-card">
            <img [src]="dest.imageUrl" [alt]="dest.name + ' in ' + dest.province" class="cg-dest-img" loading="lazy" />
            <div class="cg-dest-gradient"></div>
            <div class="cg-dest-content">
              <h3 class="cg-dest-name">{{ dest.name }}</h3>
              <div class="cg-dest-location">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                  <circle cx="12" cy="10" r="3" />
                </svg>
                <span>{{ dest.province }}</span>
              </div>
            </div>
          </a>
        }
      </div>

      <button
        type="button"
        class="cg-carousel-arrow cg-carousel-arrow--right"
        (click)="scrollRight()"
        aria-label="Next destinations"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    </div>
  </div>
</section>
