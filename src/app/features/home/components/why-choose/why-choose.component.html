<section class="cg-why-choose-section" aria-label="Why Choose CeylonGo">
  <div class="cg-container">
    <div class="cg-why-header">
      <span class="cg-why-kicker">WHY CHOOSE CEYLONGO</span>
    </div>

    <div class="cg-metrics-grid">
      @for (metric of metrics; track metric.id) {
        <div class="cg-metric-card">
          <div class="cg-metric-icon-box" [style.background-color]="metric.iconBg || '#ffedd5'" [style.color]="metric.iconColor || '#ea580c'">
            @switch (metric.icon) {
              @case ('home') {
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
                  <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" />
                </svg>
              }
              @case ('bed') {
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M3.75 6a.75.75 0 00-.75.75v10.5a.75.75 0 001.5 0v-2.25h15v2.25a.75.75 0 001.5 0V12a3 3 0 00-3-3H6.75A3 3 0 003.75 6zm3.75 3a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" />
                </svg>
              }
              @case ('pin') {
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path fill-rule="evenodd" d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041a16.975 16.975 0 001.144-.742 19.58 19.58 0 002.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 00-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 002.682 2.282 16.975 16.975 0 001.145.742zM12 13.5a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                </svg>
              }
              @case ('users') {
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M4.5 6.375a4.125 4.125 0 118.25 0 4.125 4.125 0 01-8.25 0zM14.25 8.625a3.375 3.375 0 116.75 0 3.375 3.375 0 01-6.75 0zM1.5 19.125a7.125 7.125 0 0114.25 0v.003l-.001.119a.75.75 0 01-.363.63 13.067 13.067 0 01-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 01-.364-.63l-.001-.122zM17.25 19.128l-.001.144a2.25 2.25 0 01-.233.96 10.088 10.088 0 005.06-1.104.75.75 0 00.424-.67v-.006a5.25 5.25 0 00-5.25-5.25h-.08a7.12 7.12 0 01.08 5.926z" />
                </svg>
              }
            }
          </div>
          <div class="cg-metric-text">
            <span class="cg-metric-value">{{ metric.value }}</span>
            <span class="cg-metric-label">{{ metric.label }}</span>
            @if (metric.subtext) {
              <span class="cg-metric-subtext">{{ metric.subtext }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
