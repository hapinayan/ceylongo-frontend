<section class="cg-newsletter-section" aria-label="Stay Updated Newsletter">
  <!-- Sunset Beach Background Photography -->
  <div class="cg-nl-bg">
    <img
      src="assets/images/newsletter/newsletter_bg.jpg"
      alt="Dusk and golden sunset along peaceful tropical Sri Lankan coastline"
      class="cg-nl-img"
      loading="lazy"
    />
    <div class="cg-nl-overlay" aria-hidden="true"></div>
  </div>

  <div class="cg-container cg-nl-container">
    <div class="cg-nl-text">
      <h2 class="cg-nl-title">Stay Updated</h2>
      <p class="cg-nl-subtitle">
        Get the latest travel tips, new homestays and exclusive experiences.
      </p>
    </div>

    <div class="cg-nl-form-wrap">
      <form class="cg-nl-form" (ngSubmit)="onSubscribe()">
        <div class="cg-nl-input-group">
          <svg class="cg-nl-mail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="20" height="16" x="2" y="4" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
          <input
            type="email"
            class="cg-nl-input"
            placeholder="Enter your email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            aria-label="Enter your email address"
            autocomplete="email"
          />
        </div>

        <button type="submit" class="cg-nl-btn" aria-label="Subscribe to newsletter">
          Subscribe
        </button>
      </form>

      @if (status() !== 'idle') {
        <div
          class="cg-nl-status"
          [class.success]="status() === 'success'"
          [class.error]="status() === 'error'"
          role="status"
        >
          {{ message() }}
        </div>
      }
    </div>
  </div>
</section>
