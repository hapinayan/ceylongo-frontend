<div class="cg-empty-state">
  <div class="cg-empty-state__icon-wrap" aria-hidden="true">
    @switch (iconType()) {
      @case ('bookmark') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />
          <line x1="9" y1="10" x2="15" y2="10" />
        </svg>
      }
      @case ('trip') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
        </svg>
      }
      @default {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
          <line x1="8" y1="11" x2="14" y2="11" />
        </svg>
      }
    }
  </div>

  <h3 class="cg-empty-state__title">{{ title() }}</h3>
  <p class="cg-empty-state__desc">{{ description() }}</p>

  @if (actionText()) {
    <div class="cg-empty-state__action">
      <app-button
        variant="primary"
        size="md"
        (btnClick)="action.emit()"
      >
        {{ actionText() }}
      </app-button>
    </div>
  }
</div>
