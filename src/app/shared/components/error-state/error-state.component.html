<div class="cg-error-state" role="alert">
  <div class="cg-error-state__icon-wrap" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="12" />
      <line x1="12" y1="16" x2="12.01" y2="16" />
    </svg>
  </div>

  <h3 class="cg-error-state__title">{{ title() }}</h3>
  <p class="cg-error-state__message">{{ message() }}</p>

  @if (showRetry()) {
    <div class="cg-error-state__action">
      <app-button
        variant="primary"
        size="md"
        (btnClick)="retry.emit()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;margin-right:6px">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M16 21h5v-5" />
        </svg>
        <span>{{ retryText() }}</span>
      </app-button>
    </div>
  }
</div>
