<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1727" />
      <stop offset="100%" stop-color="#020817" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="eyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Shadow / Hover Glow -->
  <ellipse cx="160" cy="295" rx="70" ry="12" fill="rgba(14, 165, 233, 0.25)" filter="url(#softGlow)" />

  <!-- Robot Group (Slightly tilted floating pose) -->
  <g transform="translate(10, 5)">
    <!-- Left Floating Arm (Waving) -->
    <g transform="translate(45, 140) rotate(-25)">
      <rect x="0" y="0" width="32" height="65" rx="16" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Forearm & Hand waving -->
      <g transform="translate(4, -40) rotate(-35)">
        <rect x="0" y="0" width="28" height="55" rx="14" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="1.5" />
        <!-- Hand / Mitten -->
        <circle cx="14" cy="-8" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
        <ellipse cx="22" cy="-6" rx="6" ry="10" fill="#ffffff" />
      </g>
      <!-- Shoulder Joint -->
      <circle cx="16" cy="12" r="14" fill="url(#blueAccent)" />
    </g>

    <!-- Right Arm (Resting / Hovering) -->
    <g transform="translate(225, 155) rotate(20)">
      <rect x="0" y="0" width="30" height="70" rx="15" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="1.5" />
      <circle cx="15" cy="72" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
      <circle cx="15" cy="12" r="13" fill="url(#blueAccent)" />
    </g>

    <!-- Torso -->
    <path d="M 100 160 C 100 145, 200 145, 200 160 L 192 235 C 192 255, 108 255, 108 235 Z" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Chest Badge / AI Emblem -->
    <ellipse cx="150" cy="195" rx="22" ry="16" fill="#0f172a" />
    <circle cx="150" cy="195" r="9" fill="url(#cyanGlow)" filter="url(#eyeGlow)" />
    <circle cx="150" cy="195" r="4" fill="#ffffff" />

    <!-- Thruster / Base Ring -->
    <ellipse cx="150" cy="245" rx="36" ry="14" fill="url(#blueAccent)" />
    <ellipse cx="150" cy="248" rx="24" ry="8" fill="#38bdf8" filter="url(#softGlow)" />

    <!-- Neck Connector -->
    <rect x="134" y="132" width="32" height="18" rx="6" fill="#475569" />

    <!-- Head -->
    <rect x="80" y="45" width="140" height="105" rx="52" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2.5" />

    <!-- Side Headset / Ear Pods -->
    <rect x="68" y="75" width="16" height="42" rx="8" fill="url(#blueAccent)" />
    <circle cx="76" cy="96" r="5" fill="#38bdf8" />

    <rect x="216" y="75" width="16" height="42" rx="8" fill="url(#blueAccent)" />
    <circle cx="224" cy="96" r="5" fill="#38bdf8" />

    <!-- Cute Top Antenna -->
    <path d="M 150 45 L 150 25" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <circle cx="150" cy="20" r="8" fill="url(#cyanGlow)" filter="url(#softGlow)" />

    <!-- Glossy Glass Visor -->
    <rect x="94" y="62" width="112" height="68" rx="34" fill="url(#visorGrad)" stroke="#1e293b" stroke-width="2" />

    <!-- Cute Glowing Blue Eyes -->
    <ellipse cx="128" cy="94" rx="14" ry="16" fill="url(#cyanGlow)" filter="url(#eyeGlow)" />
    <ellipse cx="172" cy="94" rx="14" ry="16" fill="url(#cyanGlow)" filter="url(#eyeGlow)" />

    <!-- Eye Highlights (Happy curved smile in eyes) -->
    <circle cx="132" cy="90" r="5" fill="#ffffff" />
    <circle cx="176" cy="90" r="5" fill="#ffffff" />

    <!-- Soft Visor Reflection -->
    <path d="M 105 72 C 125 65, 175 65, 195 72 C 190 82, 170 78, 105 72 Z" fill="rgba(255, 255, 255, 0.2)" />
  </g>
</svg>
